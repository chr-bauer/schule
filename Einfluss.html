<style>

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:17px;line-height:1.45}
body.beamer{font-size:19px}
button{font:inherit;cursor:pointer;border:none;border-radius:10px;padding:.6em 1em;background:var(--accent);color:#fff;font-weight:600;touch-action:manipulation}
button.sec{background:var(--accent2);color:var(--accent)}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
button.danger{background:#fbe9e7;color:var(--bad)}
button:disabled{opacity:.45;cursor:default}
button.small{padding:.35em .7em;font-size:.85em}
input,textarea,select{font:inherit;border:1px solid var(--line);border-radius:10px;padding:.55em .7em;background:#fff;color:var(--ink);width:100%}
textarea{min-height:6.5em;resize:vertical}
h1,h2,h3{line-height:1.2;margin:.2em 0 .5em}
h1{font-size:1.9em} h2{font-size:1.4em} h3{font-size:1.1em}
.wrap{max-width:1180px;margin:0 auto;padding:18px 18px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin:12px 0}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g5{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.pill{display:inline-block;padding:.15em .6em;border-radius:99px;font-size:.8em;font-weight:600;background:var(--accent2);color:var(--accent)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.brand{font-weight:800;font-size:1.3em;letter-spacing:-.01em}
.brand span{color:var(--accent)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{background:#fff;color:var(--ink);border:1px solid var(--line)}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.rolechip{display:inline-flex;align-items:center;gap:.4em;font-weight:700}
.dot{width:.8em;height:.8em;border-radius:50%;display:inline-block}
.dots{letter-spacing:.1em;white-space:nowrap}
.choice{border:2px solid var(--line);border-radius:var(--r);padding:14px;background:#fff;cursor:pointer;text-align:left;color:var(--ink);font-weight:400;width:100%}
.choice:hover{border-color:#b9c4d0}
.choice.on{border-color:var(--accent);background:#f3f7fc;box-shadow:0 0 0 3px rgba(31,78,121,.12)}
.choice b{display:block;margin-bottom:.2em}
.phasebar{display:flex;gap:4px;margin:8px 0}
.phasebar div{flex:1;padding:.45em .3em;border-radius:8px;text-align:center;font-size:.82em;font-weight:600;background:#e9e6df;color:var(--muted)}
.phasebar div.done{background:#cfdbe8;color:var(--accent)}
.phasebar div.now{background:var(--accent);color:#fff}
.phasebar div.skip{background:#f6dfe3;color:#a8203a;text-decoration:line-through}
.fb{border-left:5px solid var(--line);padding:.6em .9em;border-radius:8px;background:#faf9f6;margin:.5em 0}
.fb.ok{border-color:var(--ok);background:#eef6ee}
.fb.warn{border-color:var(--warn);background:#fdf5e6}
.fb.bad{border-color:var(--bad);background:#fcefee}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:2.4em;font-weight:800;letter-spacing:.12em;background:#111;color:#fff;border-radius:12px;padding:.25em .6em;display:inline-block}
.baro{position:relative;height:26px;border-radius:99px;background:linear-gradient(90deg,#d9e7f5,#f0eee8 50%,#f5dede)}
.baro .mk{position:absolute;top:-6px;width:6px;height:38px;border-radius:3px;background:var(--ink);transform:translateX(-3px);transition:left .9s ease}
.baro .mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:#bbb}
.barolab{display:flex;justify-content:space-between;font-size:.8em;color:var(--muted);margin-top:4px}
.evcard{border-radius:var(--r);padding:16px 18px;background:#fff8e1;border:2px dashed #e0b84d}
.gcard{border-top:6px solid var(--line)}
.move{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;background:#fcfcfa}
.move .t{font-weight:700}
.calc{font-size:.85em;color:var(--muted)}
.big{font-size:1.6em;font-weight:800}
.heat td,.heat th{padding:.45em .6em;text-align:center;border-bottom:1px solid var(--line)}
.heat th{font-size:.85em;color:var(--muted);font-weight:600}
.heat td:first-child,.heat th:first-child{text-align:left}
table{border-collapse:collapse;width:100%}
.bar{height:24px;border-radius:6px}
.small{font-size:.85em}
.cyc{width:100%;max-width:640px;height:auto;display:block;margin:auto}
.cyc .node{cursor:pointer}
.cyc .node circle{transition:all .2s}
.cyc .node:hover circle{stroke-width:5}
.hidden{display:none}
.center{text-align:center}
.startbtn{padding:22px;font-size:1.15em;text-align:left;border-radius:var(--r)}
.startbtn small{display:block;font-weight:400;opacity:.85;margin-top:.3em}
ul.tight{margin:.3em 0;padding-left:1.2em} ul.tight li{margin:.2em 0}
.counter{font-size:.8em;color:var(--muted);text-align:right}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.toggle button{border-radius:0;background:#fff;color:var(--ink);font-weight:600}
.toggle button.on{background:var(--accent);color:#fff}
.banner{padding:14px 18px;border-radius:var(--r);background:var(--accent);color:#fff}
.banner h2{margin:0 0 .2em}
@media (max-width:700px){h1{font-size:1.5em}.code{font-size:1.8em}}
</style>
</head>

/* Begründungs-Check (regelbasiert) */
function checkText(text, phaseIdx){
  const t = (text||'').toLowerCase();
  const hints=[]; let bonus=0;
  if(t.trim().length < 60){
    hints.push({k:'bad', m:'Zu knapp. Erläutert in ganzen Sätzen, wie das Instrument in dieser Phase wirkt.'});
    return {bonus:0,hints};
  }
  if(/\b(weil|da|denn|dadurch|deshalb|daher|sodass|so dass|damit|wodurch|folglich|deswegen)\b/.test(t)){
    bonus++; hints.push({k:'ok', m:'Kausaler Zusammenhang erkennbar (+1).'});
  } else hints.push({k:'warn', m:'Es fehlt ein begründender Zusammenhang (weil, dadurch, sodass …).'});
  const keys = PHASES[phaseIdx].keys.concat(['phase','politikzyklus']);
  if(keys.some(k=>t.includes(k))){
    bonus++; hints.push({k:'ok', m:`Bezug zur Phase „${PHASES[phaseIdx].name}“ erkennbar (+1).`});
  } else hints.push({k:'warn', m:`Kein Bezug zur aktuellen Phase „${PHASES[phaseIdx].name}“ erkennbar.`});
  return {bonus,hints};
}

/* Zugcode */
function checksum(payload, roleId, round){
  let s = roleId.charCodeAt(0)*7 + (round+1)*13;
  for(let i=0;i<payload.length;i++) s += payload.charCodeAt(i)*(i+3);
  return String.fromCharCode(65 + s%26);
}
function encode(roleId, round, moves){
  const p = moves.map(m=>m.instr + m.bonus + (roleId==='B' ? (m.dir>0?'P':'K') : '')).join('');
  return p + checksum(p, roleId, round);
}
function fmtCode(c, roleId){
  const ml = roleId==='B'?3:2; const p=c.slice(0,-1); const parts=[];
  for(let i=0;i<p.length;i+=ml) parts.push(p.slice(i,i+ml));
  return parts.join(' ')+' – '+c.slice(-1);
}
function decode(roleId, round, raw){
  const c = (raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(c.length<3) return {err:'Code zu kurz.'};
  const p = c.slice(0,-1);
  if(checksum(p, roleId, round) !== c.slice(-1)) return {err:'Code passt nicht – Tippfehler, falsche Gruppe oder falsche Phase?'};
  const ml = roleId==='B'?3:2;
  if(p.length % ml !== 0) return {err:'Code hat die falsche Länge.'};
  const n = p.length/ml; if(n<1||n>2) return {err:'Code enthält zu viele oder zu wenige Züge.'};
  const moves=[];
  for(let i=0;i<n;i++){
    const s = p.slice(i*ml,(i+1)*ml);
    const instr=s[0], bonus=+s[1];
    if(!ROLE[roleId].instr[instr] || !(bonus>=0&&bonus<=2)) return {err:'Code enthält einen ungültigen Zug.'};
    const dir = roleId==='B' ? (s[2]==='P'?1:-1) : ROLE[roleId].dir;
    moves.push({instr,bonus,dir,ch:null});
  }
  return {moves, code:c};
}
function baseOf(roleId, instr, round){
  const pf = INSTR[instr].fit[round], af = ROLE[roleId].instr[instr];
  return {pf, af, base: pf*af};
}

function evMod(ev, m){ if(ev===null) return 0; const E=EVENTS[ev]; return (E.instr[m.instr]||0) + (m.dir>0?E.pro:E.contra); }
function moveCalc(roleId, m, round, ev){
  const b=baseOf(roleId, m.instr, round);
  if(b.base===0) return {...b, bonus:0, mod:0, total:0, chg:0};
  const mod=evMod(ev,m);
  let total=Math.max(0,b.base+m.bonus+mod), chg=0;
  if(m.ch){ if(m.ch.ok){chg=-total; total=0;} else {chg=2; total+=2;} }
  return {...b, bonus:m.bonus, mod, total, chg};
}

        else if(BS.chOpen===key){
          chHTML=`<div class="fb small" style="margin-top:6px"><b>Wer legt Einspruch ein?</b><div class="row" style="margin:6px 0">${ROLES.filter(x=>x.id!==r.id).map(x=>`<button class="${BS.chBy===x.id?'':'sec'} small" data-a="chby" data-v="${x.id}">${esc(x.kurz)}</button>`).join('')}</div>
          <div class="row"><button class="small" style="background:var(--ok)" data-a="chres" data-v="ok" ${BS.chBy?'':'disabled'}>Einspruch erfolgreich</button><button class="small" style="background:var(--bad)" data-a="chres" data-v="no" ${BS.chBy?'':'disabled'}>abgewiesen</button><button class="ghost small" data-a="chcancel">abbrechen</button></div>
          <div class="muted" style="margin-top:4px">Erfolgreich: Zug zählt 0, Einspruch-Gruppe +2 Debattenpunkte. Abgewiesen: Zug +2, Einspruch-Gruppe −1.</div></div>`;
        } else if(!BS.evaluated) chHTML=`<button class="ghost small" style="margin-top:4px" data-a="chopen" data-v="${key}">⚖️ Einspruch</button>`;

          ${r.id==='B'?`<div class="small">${dirLabel(m.dir)}</div>`:''}
          <div class="calc">${c.base===0?'in dieser Phase wirkungslos':`${c.pf}×${c.af} + Begr. ${c.bonus}${c.mod?` ${c.mod>0?'+':'−'} Ereignis ${Math.abs(c.mod)}`:''}${c.chg?` ${c.chg>0?'+':'−'} Einspruch ${Math.abs(c.chg)}`:''}`}</div>
          <div class="big">${c.total}</div>${chHTML}</div>`;}).join('')
        + (!BS.evaluated?`<button class="ghost small" data-a="bclear" data-v="${r.id}">Code ändern</button>`:'');
    } else if(!BS.evaluated){
      inner = `<input id="code-${r.id}" data-codein="${r.id}" placeholder="Zugcode" autocomplete="off" autocapitalize="characters" spellcheck="false" style="text-transform:uppercase;font-family:ui-monospace,monospace;font-weight:700" value="${esc(g.raw||'')}">
        <button class="small" style="margin-top:6px" data-a="bcode" data-v="${r.id}">Eintragen</button>

function bAuswertung(){
  const tot = ROLES.map(r=>({r, s:BS.pts[r.id].reduce((a,b)=>a+b,0)}));
  const max = Math.max(1,...tot.map(t=>t.s));
  const cellMax = Math.max(1,...ROLES.flatMap(r=>BS.pts[r.id]));
  const final=outcome(BS.baro);
  // Barometerverlauf
  const W=620,H=220,pl=100,pr=44,pt=24,pb=34;
  const xs=i=>pl+i*(W-pl-pr)/NP, ys=v=>H-pb-(v/100)*(H-pt-pb);
  const hx = BS.hist.map((v,i)=> (BS.nonDecision && i>=5) ? i+1 : i);
  const line=BS.hist.map((v,i)=>`${i?'L':'M'}${xs(hx[i])} ${ys(v)}`).join(' ');
  const svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    <rect x="${pl}" y="${pt}" width="${W-pl-pr}" height="${H-pt-pb}" fill="#faf9f6" stroke="#e5e1d8"/>
    <line x1="${pl}" x2="${W-pr}" y1="${ys(50)}" y2="${ys(50)}" stroke="#bbb" stroke-dasharray="4 4"/>
    <text x="${pl-10}" y="${ys(100)+4}" font-size="12" text-anchor="end" fill="#5f6670">striktes Verbot</text>
    <text x="${pl-10}" y="${ys(50)+4}" font-size="12" text-anchor="end" fill="#5f6670">Kompromiss</text>
    <text x="${pl-10}" y="${ys(0)+4}" font-size="12" text-anchor="end" fill="#5f6670">kein Verbot</text>
    ${['Start'].concat(PHASES.map(p=>p.short)).map((l,i)=>`<text x="${xs(i)}" y="${H-10}" font-size="11" text-anchor="middle" fill="#5f6670">${esc(l.length>13?l.slice(0,11)+'.':l)}</text>`).join('')}
    <path d="${line}" fill="none" stroke="#1f4e79" stroke-width="3"/>${BS.hist.map((v,i)=>`<circle cx="${xs(hx[i])}" cy="${ys(v)}" r="5" fill="#1f4e79"/><text x="${xs(hx[i])}" y="${ys(v)-10}" font-size="13" text-anchor="middle" font-weight="700">${v}</text>`).join('')}</svg>`;
  // Impulse
  const imp=[];
  const sorted=tot.slice().sort((a,b)=>b.s-a.s);
  if(sorted[0].s>0) imp.push(`<b>${esc(sorted[0].r.name)}</b> hatte mit ${sorted[0].s} Punkten den größten Einfluss, <b>${esc(sorted[4].r.name)}</b> mit ${sorted[4].s} den geringsten. Lag das an den Ressourcen oder an der Strategie?`);
  const ent=ROLES.filter(r=>BS.pts[r.id][3]>0).map(r=>r.kurz);
  if(BS.nonDecision) imp.push(`Es kam zur <b>Nicht-Entscheidung</b>: ${esc(BS.ndReason)} Wer hat davon profitiert – und ist es demokratisch, wenn ein Vorhaben so scheitert?`);
  imp.push(`In der Entscheidungsphase sammelten Punkte: ${ent.length?esc(ent.join(', ')):'niemand'}. Was bedeutet es, dass am Ende Abgeordnete entscheiden?`);
  if(!BS.nonDecision){ const impl=ROLES.filter(r=>BS.pts[r.id][4]>0).map(r=>`${r.kurz} (${BS.pts[r.id][4]})`); imp.push(`In der Implementation hatten Einfluss: ${impl.length?esc(impl.join(', ')):'niemand'}. Wer bestimmt, wie ein Gesetz in der Praxis tatsächlich wirkt?`); }
  const v=tot.find(t=>t.r.id==='V'); if(v.s>0) imp.push(`Der Verband erzielte ${Math.round(100*(BS.pts.V[1]+BS.pts.V[4])/v.s)} % seines Einflusses bei der Politikformulierung und der Implementation – Phasen, die die Öffentlichkeit kaum beachtet. Ist das ein Problem für die Demokratie?`);
  const m=tot.find(t=>t.r.id==='M'); imp.push(`Die Jugendbewegung kam auf ${m.s} Punkte, obwohl viele ihrer Mitglieder nicht wählen dürfen. Welche Rolle spielen Bewegungen für Menschen ohne Stimmrecht?`);
  const b=tot.find(t=>t.r.id==='B'); const bp=BS.pts.B.indexOf(Math.max(...BS.pts.B)); imp.push(`Die Bürger kamen auf ${b.s} Punkte, am stärksten in Phase ${bp+1} (${esc(PHASES[bp].short)}). Reicht die Wahl als Einflussmittel der Bürger?`);
  if(BS.instrUse.M) imp.push(`Es wurde ${BS.instrUse.M}× zu zivilem Ungehorsam (Schulstreik) gegriffen. Ist ein Regelbruch ein legitimes Mittel politischer Einflussnahme?`);
  if(BS.instrUse.N) imp.push(`Es gab ${BS.instrUse.N}× eine Parteispende. Legal, aber fair?`);
  const useList=Object.entries(BS.instrUse).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,c])=>`${esc(INSTR[k].name)} (${c}×)`).join(', ');
  const bannerHTML = BS.nonDecision
    ? `<div class="banner" style="background:#b3133b"><h2>Ergebnis: Nicht-Entscheidung</h2><p style="margin:.2em 0">${esc(BS.ndReason)} Das Gesetz ist gescheitert, es bleibt beim Status quo.</p>
       <p class="small" style="margin:.2em 0;opacity:.95">Neue Problemwahrnehmung: Nach der Bewertung zielt ein neuer Anlauf in Richtung „${esc(final[1])}“ (${BS.baro}/100).</p></div>`
    : `<div class="banner"><h2>Ergebnis: ${esc(final[1])}</h2><p style="margin:.2em 0">${esc(final[2])}</p>
       ${BS.decided?`<p class="small" style="margin:.2em 0;opacity:.9">Beschlossen hatte der Bundestag in Phase 4: ${esc(BS.decided[1])}</p>`:''}</div>`;
  return `${bannerHTML}
    <div class="grid g2" style="margin-top:12px;align-items:start">
    <div class="card" style="margin:0"><h3>Einflusspunkte gesamt</h3>
      ${tot.map(t=>`<div style="margin:8px 0"><div class="row" style="justify-content:space-between"><span>${roleChip(t.r)}</span><b>${t.s}</b></div><div class="bar" style="width:${100*t.s/max}%;background:var(--${t.r.id});min-width:4px"></div></div>`).join('')}
      <p class="small muted">Debattenpunkte durch Einsprüche: ${ROLES.map(r=>`${esc(r.kurz)} ${BS.deb[r.id]}`).join(' · ')}</p></div>
    <div class="card" style="margin:0"><h3>Verlauf des Gesetzesbarometers</h3>${svg}</div></div>
    <div class="card"><h3>Wer hatte wann Einfluss?</h3><table class="heat"><tr><th>Akteur</th>${PHASES.map((p,i)=>`<th>${i+1}. ${esc(p.short)}</th>`).join('')}</tr>
      ${ROLES.map(r=>`<tr><td>${roleChip(r)}</td>${BS.pts[r.id].map((v,i)=> (BS.nonDecision&&i===4) ? `<td style="background:#f6dfe3;color:#a8203a">entfällt</td>` : `<td style="background:rgba(31,78,121,${(0.08+0.8*v/cellMax).toFixed(2)});color:${v/cellMax>0.55?'#fff':'inherit'};font-weight:700">${v}</td>`).join('')}</tr>`).join('')}</table>
      ${useList?`<p class="small muted">Häufigste Instrumente: ${useList}</p>`:''}</div>
    <div class="card"><h3>Erläutern: Was zeigt das Spiel?</h3><ul class="tight">${imp.map(x=>`<li>${x}</li>`).join('')}</ul></div>
    <div class="card"><h3>Stellung nehmen</h3>
      ${BS.showLeit?`<p class="big" style="font-size:1.35em">Haben in unserer Demokratie alle Akteure faire Chancen, politische Entscheidungen zu beeinflussen?</p>
      <div class="grid g3 small"><div class="fb"><b>Effektivität</b><br>Wer setzt sich durch – und womit?</div><div class="fb"><b>Legitimität</b><br>Ist der Weg demokratisch legitimiert?</div><div class="fb"><b>Gleichheit</b><br>Haben alle dieselben Chancen?</div><div class="fb"><b>Transparenz</b><br>Ist der Einfluss sichtbar und kontrollierbar?</div></div>
      <p><b>Positionslinie:</b> Stellt euch im Raum auf, zwischen „völlig fair“ und „völlig unfair“. Begründet eure Position mit einem Beleg aus dem Spiel. Wer seine Position wechselt, sagt, welches Argument ihn überzeugt hat.</p>`
      :`<button data-a="leit">Leitfrage aufdecken</button>`}</div>`;
}

const A = {
  mode:v=>{MODE=v;},
  home:()=>{MODE=null;},
  // Gruppe
  gtab:v=>{G.tab=v; G.arm=false; window.scrollTo(0,0);},
  quiz:v=>{const [q,p]=v.split(':').map(Number); G.quiz[q]=p;},
  quizreset:()=>{G.quiz={}; G.quizOrder=shuffle(QUIZ.map((q,i)=>i));},
  rolechange:()=>{G.changeRole=true;},
  rolecancel:()=>{G.changeRole=false;},
  role:v=>{ if(G.role!==v){ G.results=[]; G.round=0; G.view='edit'; G.cur={sel:[],texts:{},dirs:{}}; } G.role=v; G.changeRole=false; },
  sel:v=>{const s=G.cur.sel; const i=s.indexOf(v); if(i>=0) s.splice(i,1); else { if(s.length>=2) s.shift(); s.push(v); if(G.role==='B'&&G.cur.dirs[v]===undefined) G.cur.dirs[v]=0; }},
  dir:v=>{const [k,d]=v.split(':'); G.cur.dirs[k]=+d;},
  submit:()=>{
    const c=G.cur; const err=[];
    c.sel.forEach(k=>{ if(!(c.texts[k]||'').trim()) err.push(`Begründung für „${INSTR[k].name}“ fehlt.`); if(G.role==='B'&&!c.dirs[k]) err.push(`Wählt bei „${INSTR[k].name}“, ob ihr für oder gegen das Verbot Druck macht.`); });
    if(err.length){ const el=document.getElementById('gerr'); if(el) el.innerHTML=err.map(e=>`<div class="fb bad">${esc(e)}</div>`).join(''); return 'norender'; }
    const moves=c.sel.map(k=>{ const b=baseOf(G.role,k,G.round); const ch=checkText(c.texts[k],G.round); const bonus=b.base>0?ch.bonus:0;
      return {instr:k, dir:G.role==='B'?c.dirs[k]:ROLE[G.role].dir, text:c.texts[k], pf:b.pf, af:b.af, base:b.base, bonus, hints:ch.hints, total:b.base>0?b.base+bonus:0}; });
    const code=encode(G.role,G.round,moves.map(m=>({instr:m.instr,bonus:m.bonus,dir:m.dir})));
    G.results[G.round]={moves,code}; G.view='result'; G.arm=false; window.scrollTo(0,0);
  },
  edit:()=>{G.view='edit'; G.arm=false;},
  backres:()=>{G.view='result';},
  next:v=>{ if(G.arm!==v){G.arm=v; return;} G.arm=false; if(v==='skip'){ G.skipped=true; G.round=5; } else G.round++; G.view='edit'; G.cur={sel:[],texts:{},dirs:{}};  window.scrollTo(0,0); },
  // Beamer
  bsel:v=>{BS.sel= v==='nd'?'nd':+v;},
  bstart:()=>{BS.step='round';},
  bstep:v=>{BS.step=v; BS.arm=false;},
  draw:()=>{ let pool=EVENTS.map((e,i)=>i).filter(i=>!BS.used.includes(i)); if(!pool.length){BS.used=[]; pool=EVENTS.map((e,i)=>i);} const i=pool[Math.floor(Math.random()*pool.length)]; BS.event=i; BS.used.push(i); },
  noevent:()=>{BS.event=null;},
  bcode:v=>{ const el=document.getElementById('code-'+v); const raw=el?el.value:''; const d=decode(v,BS.round,raw); BS.groups[v]= d.err?{raw,err:d.err}:{code:d.code,moves:d.moves}; },
  bclear:v=>{ const g=BS.groups[v]; BS.groups[v]={raw:g&&g.code?g.code:''}; },
  chopen:v=>{BS.chOpen=v; BS.chBy=null;},
  chby:v=>{BS.chBy=v;},
  chcancel:()=>{BS.chOpen=null; BS.chBy=null;},
  chres:v=>{ const [r,i]=BS.chOpen.split(':'); BS.groups[r].moves[+i].ch={by:BS.chBy, ok:v==='ok'}; BS.chOpen=null; BS.chBy=null; },
  chdel:v=>{ const [r,i]=v.split(':'); BS.groups[r].moves[+i].ch=null; },
  eval:()=>{
    const snap=JSON.parse(JSON.stringify(BS)); snap.prev=null; BS.prev=snap;
    let delta=0;
    ROLES.forEach(r=>{ const g=BS.groups[r.id]; if(!g||!g.moves) return;
      g.moves.forEach(m=>{ const c=moveCalc(r.id,m,BS.round,BS.event); delta+=c.total*m.dir; BS.pts[r.id][BS.round]+=c.total; BS.instrUse[m.instr]=(BS.instrUse[m.instr]||0)+1;
        if(m.ch) BS.deb[m.ch.by]+= m.ch.ok?2:-1; }); });
    const nb=Math.max(0,Math.min(100,Math.round(BS.baro+delta*0.8)));
    BS.lastDelta=nb-BS.baro; BS.baro=nb; BS.hist.push(nb); BS.evaluated=true;
    if(BS.round===3){
      const voted = !!(BS.groups.P && BS.groups.P.moves && BS.groups.P.moves.some(m=>m.instr==='J' && !(m.ch&&m.ch.ok)));
      if(!voted || nb<35){ BS.nonDecision=true; BS.ndReason = !voted ? 'Die Regierungspartei hat das Gesetz nicht zur Abstimmung gebracht.' : 'Für das Gesetz findet sich keine Mehrheit (Barometer unter 35).'; BS.decided=[0,'Nicht-Entscheidung','Keine Einigung – das Gesetz kommt nicht zustande, es bleibt beim Status quo.']; }
      else BS.decided=outcome(nb);
    }
  },
  undo:()=>{ if(BS.prev){ BS=BS.prev; BS.prev=null; } },
  bnext:()=>{ BS.prev=null; if(BS.round<NP-1){ BS.round += (BS.round===3&&BS.nonDecision)?2:1; BS.groups={}; BS.event=null; BS.evaluated=false; BS.chOpen=null; } else { BS.round=NP; BS.step='auswertung'; } window.scrollTo(0,0); },
  leit:()=>{BS.showLeit=true;},
  breset:()=>{ if(!BS.arm){BS.arm=true; return;} BS=newB(); }
};

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el||el.disabled) return;
  const a=el.dataset.a; if(!A[a]) return;
  if(a!=='breset' && BS.arm) BS.arm=false;
  const res=A[a](el.dataset.v, el, e);
  if(res!=='norender') render(); else persist();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.in){ G.cur.texts[t.dataset.in]=t.value; const c=document.getElementById('cnt-'+t.dataset.in); if(c) c.textContent=t.value.length+' Zeichen'; persist(); }
  else if(t.dataset.codein){ const g=BS.groups[t.dataset.codein]||(BS.groups[t.dataset.codein]={}); g.raw=t.value; persist(); }
});
document.addEventListener('keydown',e=>{
  const t=e.target; if(e.key==='Enter' && t.dataset && t.dataset.codein){ e.preventDefault(); A.bcode(t.dataset.codein); render(); const nx=ROLES.find(r=>!(BS.groups[r.id]&&BS.groups[r.id].moves)); if(nx){const el=document.getElementById('code-'+nx.id); if(el) el.focus();} }
});
render();
</script>
</body>
